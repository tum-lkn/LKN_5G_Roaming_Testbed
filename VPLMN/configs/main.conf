# Main configuration for dynamic Open5GS batch testing
# Define all parameter options as bash arrays for easy parsing

# Modes
MODE_NAMES=(non-roaming lbo hr hr-ipsec hr-remote-upf)
MODES=(non-roaming lbo hr hr hr-remote-upf)

# Values from https://wondernetwork.com/pings/Frankfurt
# Latency options (ms)
hPLMN="Germany" # fixed home location # for reference
vPLMNs=("France" "USA" "Australia") # for reference
LATENCIES=(16 44 150) # latency to Paris, Boston, Sydney

# Jitter options (ms) per latency - parallel arrays
# Jitter in IPX networks is very stable, since there are strict SLAs
JITTERS=(1 1 2) # jitter to Paris, Boston, Sydney

# DN Latency options (ms)
# this is even more complex 
# - it depends on the location (so, latency)
# - it depends on the mode (for hr, the latency is added at hUPF and for lbo and non-roaming at vUPF)
# DN_LATENCIES=(0)
DN_LOCATIONS=("Frankfurt" "Paris" "Boston" "Sydney") # for reference
# refers to PLMNS: Germany, France, USA, Australia
# in other words: hPLMN, vPLMN1, vPLMN2, vPLMN3
DN_LATENCIES_0=(0 16 44 150) # Frankfurt # for non-roaming, hr, and hr-ipsec
DN_LATENCIES_1=(16 0 40 139) # Paris # for lbo, and hr-remote-upf if vPLMN is France
DN_LATENCIES_2=(44 40 0 104) # Boston # for lbo, and hr-remote-upf if vPLMN is USA
DN_LATENCIES_3=(150 139 104 0) # Sydney # for lbo, and hr-remote-upf if vPLMN is Australia
DN_JITTERS_0=(0 1 1 2) # Frankfurt
DN_JITTERS_1=(1 0 1 2) # Paris
DN_JITTERS_2=(1 1 0 2) # Boston
DN_JITTERS_3=(2 2 2 0) # Sydney

# Ping payload sizes (bytes)
PING_PAYLOADS=(56)

# Other static/default parameters
ITERATIONS=5
PING_COUNT=2
PING_TARGET=10.162.149.115
ITERATION_DELAY=1
TESTBED_RESTART_INTERVAL=0
PING_INTERVAL=0.2
NETWORK_READY_TIMEOUT=30
SERVICE_CHECK_INTERVAL=1
IPSEC_ESTABLISH_TIMEOUT=10
MIN_NETWORK_STABILIZE_TIME=10

# Security settings (can be expanded if needed)
VPLMN_SECURITY=tls
HPLMN_SECURITY=tls

############## new stuff for testing
PING_TEST_ENABLED=true
DOWNLOAD_TEST_ENABLED=true
VIDEO_TEST_ENABLED=true
IPERF_TEST_ENABLED=true
WEBPAGE_TEST_ENABLED=true

DOWNLOAD_TEST_URL="http://10.162.149.115:9000/10MB.bin"
DOWNLOAD_TEST_SIZE_LABEL="10MB"

VIDEO_TEST_URL="http://10.162.149.115:9000/video_150MB.mp4"
VIDEO_TEST_SIZE_LABEL="150MB Video"

# IPERF_SERVER_IP=10.162.149.55
IPERF_SERVER_IP=10.162.149.115
IPERF_SERVER_PORT=5201
IPERF_DURATION=5
IPERF_PARALLEL=1
IPERF_REVERSE=true
IPERF_UDP=true
IPERF_BANDWIDTH=100M

# Webpage Loading Test (Browsertime real-browser page-load timings:
# TTFB, First/Largest Contentful Paint, DOM Content Loaded, Page Load, Total)
WEBPAGE_BROWSER=firefox
WEBPAGE_ITERATIONS=1
WEBPAGE_TIMEOUT=120
# Add one WEBPAGE_URL_N line per URL to test (N = 1, 2, 3, ...)
WEBPAGE_URL_1=https://www.youtube.com/@Cristiano
WEBPAGE_URL_2=https://www.instagram.com/leomessi/
WEBPAGE_URL_3=https://en.wikipedia.org/wiki/Cristiano_Ronaldo
WEBPAGE_URL_4=https://github.com/open5gs/open5gs

N6_DELAY_ENABLED=true
N6_SERVER_DELAY_ENABLED=true
N6_SERVER_INTERFACE=ens18