# DSK matrix for the non-roaming SIM only — run it on its own: select only this file in the
# WebUI batch list (not 'Run all configs'). Progress: logs/batch_runner_main_DSK_non_roaming.state
# Copy of main_DSK.conf; keep the two in sync except for MODE_NAMES.
# Main configuration for dynamic Open5GS batch testing
# Define all parameter options as bash arrays for easy parsing

# UE: the commercial RAN (gNB + USB dongle) instead of PacketRusher.
# The SIM in the dongle decides the roaming mode: configs whose mode does not
# match the inserted SIM are set aside and picked up with --resume after the swap.
UE_TYPE=dsk
DSK_DONGLE=b          # a | b
DSK_CYCLE=airplane    # airplane (seconds per iteration) | reboot (minutes)

# Modes
MODE_NAMES=(non-roaming)

# Values from https://wondernetwork.com/pings/Frankfurt
# Latency options (ms)
hPLMN="Germany" # fixed home location # for reference
vPLMNs=("USA") # for reference
LATENCIES=(44) # latency to Paris, Boston, Sydney

# Jitter options (ms) per latency - parallel arrays
# Jitter in IPX networks is very stable, since there are strict SLAs
JITTERS=(1) # jitter to Paris, Boston, Sydney

# DN Latency options (ms)
# this is even more complex 
# - it depends on the location (so, latency)
# - it depends on the mode (for hr, the latency is added at hUPF and for lbo and non-roaming at vUPF)
# DN_LATENCIES=(0)
DN_LOCATIONS=("Frankfurt" "Boston") # for reference
# DN_LATENCIES_<i> / DN_JITTERS_<i> is the row for DN_LOCATIONS[i]; its entries
# are the delays from that location to each DN_LOCATIONS entry, in order.
DN_LATENCIES_0=(0 44) # Frankfurt # for non-roaming, hr, and hr-ipsec
DN_LATENCIES_1=(44 0) # Boston # for lbo, and hr-remote-upf (vPLMN USA)
DN_JITTERS_0=(0 1) # Frankfurt
DN_JITTERS_1=(1 0) # Boston

# Ping payload sizes (bytes)
PING_PAYLOADS=(56)

# Other static/default parameters
ITERATIONS=5
PING_COUNT=20
PING_TARGET=10.0.0.30
ITERATION_DELAY=1
TESTBED_RESTART_INTERVAL=0
PING_INTERVAL=0.2
NETWORK_READY_TIMEOUT=30
SERVICE_CHECK_INTERVAL=1
IPSEC_ESTABLISH_TIMEOUT=10
MIN_NETWORK_STABILIZE_TIME=10

# Security settings (can be expanded if needed)
VPLMN_SECURITY=tls
HPLMN_SECURITY=tls

############## new stuff for testing
PING_TEST_ENABLED=true
DOWNLOAD_TEST_ENABLED=true
VIDEO_TEST_ENABLED=false
IPERF_TEST_ENABLED=true
WEBPAGE_TEST_ENABLED=true

DOWNLOAD_TEST_URL="http://10.0.0.30:9000/10MB.bin"
DOWNLOAD_TEST_SIZE_LABEL="10MB"

#VIDEO_TEST_URL="http://10.0.0.30:9000/video_150MB.mp4"
#VIDEO_TEST_SIZE_LABEL="150MB Video"

# IPERF_SERVER_IP=10.0.0.10
IPERF_SERVER_IP=10.0.0.30
IPERF_SERVER_PORT=5201
IPERF_DURATION=5
IPERF_PARALLEL=1
IPERF_REVERSE=false
IPERF_UDP=true
IPERF_BANDWIDTH=100M
# IPERF_BANDWIDTH applies to UDP only. For TCP (IPERF_UDP=false) set an optional
# rate cap here; empty or commented out = no cap, TCP then measures capacity.
#IPERF_TCP_BANDWIDTH=100M

# Webpage Loading Test (Browsertime real-browser page-load timings:
# TTFB, First/Largest Contentful Paint, DOM Content Loaded, Page Load, Total)
WEBPAGE_BROWSER=firefox
WEBPAGE_ITERATIONS=1
WEBPAGE_TIMEOUT=120
# Add one WEBPAGE_URL_N line per URL to test (N = 1, 2, 3, ...)
WEBPAGE_URL_1=https://www.youtube.com/@Cristiano
WEBPAGE_URL_2=https://www.instagram.com/leomessi/
WEBPAGE_URL_3=https://en.wikipedia.org/wiki/Cristiano_Ronaldo
WEBPAGE_URL_4=https://github.com/open5gs/open5gs

# N6 (UPF <-> DN) delay. The DN server's half is applied automatically on
# SERVER_INTERFACE of the performance server whenever N6_DELAY_ENABLED=true.
N6_DELAY_ENABLED=true
SERVER_INTERFACE=enp0s31f6   # interface of the performance server (10.0.0.30) that carries 10.0.0.0/24

# Preflight fails a config if the VPLMN, HPLMN or performance-server link is
# slower than this (Mb/s). A link that fell back to 100 Mb/s caps throughput and
# adds iperf loss. 0 turns the check off.
MIN_LINK_SPEED_MBPS=1000
