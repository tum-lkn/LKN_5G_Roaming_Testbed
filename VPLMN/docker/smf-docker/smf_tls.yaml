logger:
  file:
    path: /var/log/open5gs/smf.log

global:
  max:
    ue: 1024

smf:

  default:
    tls:
      server:
        scheme: https
        private_key: /etc/open5gs/default/tls/smf.key
        cert: /etc/open5gs/default/tls/smf.crt
        sslkeylogfile: /var/log/open5gs/tls/smf-server-sslkeylog.log
      client:
        scheme: https
        cacert: /etc/open5gs/default/tls/ca.crt
        client_sslkeylogfile: /var/log/open5gs/tls/smf-client-sslkeylog.log



  sbi:
    server:
      - address: smf.5gc.mnc071.mcc999.3gppnetwork.org

    client:
      nrf:
        - uri: https://nrf.5gc.mnc071.mcc999.3gppnetwork.org


  pfcp:
    server:
      - address: 192.168.50.193
    client:
      upf:
        - address: 10.162.149.192 # VPLMN_IP - Update this to your VPLMN PC IP

  gtpc:
    server:
      - address: 192.168.50.193

  gtpu:
    server:
      - address: 192.168.50.193

  metrics:
    server:
      - address: 192.168.50.193
        port: 9090

  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
    - subnet: 2001:db8:cafe::/48
      gateway: 2001:db8:cafe::1

  dns:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844

  mtu: 1400
