logger:
  file:
    path: /var/log/open5gs/scp.log

global:
  max:
    ue: 1024

scp:

  default:
    tls:
      server:
        scheme: https
        private_key: /etc/open5gs/default/tls/scp.key
        cert: /etc/open5gs/default/tls/scp.crt
        sslkeylogfile: /var/log/open5gs/tls/scp-server-sslkeylog.log
      client:
        scheme: https
        cacert: /etc/open5gs/default/tls/ca.crt
        client_sslkeylogfile: /var/log/open5gs/tls/scp-client-sslkeylog.log

  sbi:
    server:
      - address: scp.localdomain
