# strongswan.conf for the PQ IKE evaluation containers
# (no systemd in containers -> plain `charon` daemon, logging to a file)

charon {
    # keep all compiled-in plugins (default behaviour)

    filelog {
        main {
            path = /var/log/strongswan/charon.log
            time_format = %b %e %T
            time_precision = us
            ike_name = yes
            append = no
            default = 1
        }
    }
}
