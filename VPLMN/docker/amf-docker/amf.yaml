logger:
  file:
    path: var/log/open5gs/amf.log
#  level: info   # fatal|error|warn|info(default)|debug|trace

global:
  max:
    ue: 1024  # The number of UE can be increased depending on memory size.
#    peer: 64

amf:
  sbi:
    server:
      - address: 192.168.50.185
        port: 7777
    client:
#      nrf:
#        - uri: http://127.0.0.10:7777
      scp:
        - uri: http://192.168.50.188:7777 # Host Name and related port in Core 1
  ngap:
    server:
      - address: 192.168.70.185  # NGAP_BIND — 0.0.0.0 when the commercial RAN is enabled (lib/features/set-dongle-mode.sh)

  metrics:
    server:
      - address: 192.168.50.185  # METRICS_BIND — 0.0.0.0 when the commercial RAN is enabled
        port: 9090
  access_control:
    - plmn_id:
        mcc: 999
        mnc: 71
    - plmn_id:
        mcc: 001
        mnc: 01
    - plmn_id:
        mcc: 315
        mnc: 010
  guami:
    - plmn_id:
        mcc: 999
        mnc: 71
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 999
        mnc: 71
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 999
        mnc: 71
      s_nssai:
        - sst: 1
  security:
    integrity_order: [ NIA1, NIA2 ]
    ciphering_order: [ NEA0, NEA1, NEA2 ]
  network_name:
    full: Open5GS
    short: Next
  amf_name: open5gs-amf0
  time:
#    t3502:
#      value: 720   # 12 minutes * 60 = 720 seconds
    t3512:
      value: 540    # 9 minutes * 60 = 540 seconds



