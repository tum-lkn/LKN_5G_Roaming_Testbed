logger:
  file:
    path: /var/log/open5gs/sepp.log
  level: info

global:
  max:
    ue: 1024

sepp:

  default:
    tls:
      server:
        scheme: https
        private_key: /etc/open5gs/default/tls/sepp.key
        cert: /etc/open5gs/default/tls/sepp.crt
        # NOTE: do NOT put verify_client here. In Open5GS it is applied to EVERY
        # server socket of this NF, including the SBI :443 interface that this
        # PLMN's own NFs (the SCP) reach without a client cert -> the SEPP would
        # reject them and roaming auth would fail with 5GMM cause #90. mTLS is
        # scoped to the N32 sockets in the n32.server block below.
      client:
        scheme: https
        cacert: /etc/open5gs/default/tls/ca.crt
        client_private_key: /etc/open5gs/default/tls/sepp.key
        client_cert: /etc/open5gs/default/tls/sepp.crt
  sbi:
    server:
      - address: sepp.localdomain

    client:
      nrf:
        - uri: https://nrf.5gc.mnc071.mcc999.3gppnetwork.org

  n32:
    server:
      - sender: sepp1.localdomain
        address: 0.0.0.0
        port: 8080
        # Mutual TLS on N32 only (scoped here, never on the default server block above).
        verify_client: true
        verify_client_cacert: /etc/open5gs/default/tls/ca.crt
        n32f:
          address: 0.0.0.0
          port: 8081
          verify_client: true
          verify_client_cacert: /etc/open5gs/default/tls/ca.crt
    client:
      sepp:
        - receiver: sepp2.localdomain
          uri: https://sepp2.localdomain:8080
          n32f:
            uri: https://sepp2.localdomain:8081
