      - "pcf.localdomain:192.168.50.194"
      - "nssf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.195"
      - "bsf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.196"
      - "udr.localdomain:192.168.50.199"
      - "sepp.localdomain:192.168.50.251"
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN

    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      - open5gs-nrf
      - open5gs-scp
      - open5gs-amf
      - open5gs-smf
      - open5gs-upf

  open5gs-udm:
    image: open5gs-udm:${OPEN5GS_TAG:-v2.8.0}
