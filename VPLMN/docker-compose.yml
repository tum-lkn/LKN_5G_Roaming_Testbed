version: '3.8'

networks:
  my_custom_network:
    external: true

  my_second_network:
    external: true

  my_isolated_network:  # Network for Open5gs-upf2
    external: true

services:

  open5gs-mongodb:
    image: open5gs-mongodb:${OPEN5GS_TAG:-v2.8.0}
    container_name: open5gs-mongodb
    networks:
      my_custom_network:
        ipv4_address: 192.168.50.198
    restart: on-failure
    volumes:
      # These will overwrite the files inside the container at runtime
      - ./docker/mongodb-docker/start_services.sh:/open5gs/start_services.sh
      - ./docker/mongodb-docker/open5gs-dbctl.sh:/open5gs/open5gs-dbctl.sh

  open5gs-nrf:
    image: open5gs-nrf:${OPEN5GS_TAG:-v2.8.0}
    container_name: open5gs-nrf
    networks:
      my_custom_network:
        ipv4_address: 192.168.50.189
    volumes:
      # TLS certificates
      - ./docker/nrf-docker/files/ca.crt:/etc/open5gs/default/tls/ca.crt:ro
      - ./docker/nrf-docker/files/nrf.crt:/etc/open5gs/default/tls/nrf.crt:ro
      - ./docker/nrf-docker/files/nrf.key:/etc/open5gs/default/tls/nrf.key:ro
      # Configuration
      - ./docker/nrf-docker/${NRF_CONFIG:-nrf_tls.yaml}:/etc/open5gs/default/nrf.yaml:ro
      # Binary file (allows updates without rebuilding image)
      - ./docker/nrf-docker/files/open5gs-nrfd:/usr/local/bin/open5gs-nrfd:ro

    extra_hosts:
      - "nrf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.189"
      - "scp.localdomain:192.168.50.188"
      - "amf.localdomain:192.168.50.185"
      - "smf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.193"
      - "upf.localdomain:192.168.50.187"
      - "ausf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.191"
      - "udm.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.192"
      - "pcf.localdomain:192.168.50.194"
      - "nssf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.195"
      - "bsf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.196"
      - "udr.localdomain:192.168.50.199"
      - "sepp.localdomain:192.168.50.251"

    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN

  open5gs-scp:
    image: open5gs-scp:${OPEN5GS_TAG:-v2.8.0}
    container_name: open5gs-scp
    networks:
      my_custom_network:
        ipv4_address: 192.168.50.188
    volumes:
      # TLS certificates
      - ./docker/scp-docker/files/ca.crt:/etc/open5gs/default/tls/ca.crt:ro
      - ./docker/scp-docker/files/scp.crt:/etc/open5gs/default/tls/scp.crt:ro
      - ./docker/scp-docker/files/scp.key:/etc/open5gs/default/tls/scp.key:ro
      # Configuration
      - ./docker/scp-docker/${SCP_CONFIG:-scp_tls.yaml}:/etc/open5gs/default/scp.yaml:ro
      # Binary file (allows updates without rebuilding image)
      - ./docker/scp-docker/files/open5gs-scpd:/usr/local/bin/open5gs-scpd:ro
    restart: unless-stopped
    extra_hosts:
      - "nrf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.189"
      - "scp.localdomain:192.168.50.188"
      - "amf.localdomain:192.168.50.185"
      - "smf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.193"
      - "upf.localdomain:192.168.50.187"
      - "ausf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.191"
      - "udm.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.192"
      - "pcf.localdomain:192.168.50.194"
      - "nssf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.195"
      - "bsf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.196"
      - "udr.localdomain:192.168.50.199"
      - "sepp.localdomain:192.168.50.251"
    depends_on:
      - open5gs-nrf
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN

  open5gs-amf:
    image: open5gs-amf:${OPEN5GS_TAG:-v2.8.0}
    container_name: open5gs-amf
    # network_mode: host
    networks:
      my_custom_network:
        ipv4_address: 192.168.50.185
      my_second_network:
        ipv4_address: 192.168.70.185
    ports:
      - "38412:38412/udp"
      - "38412:38412/sctp"
    volumes:
      # TLS certificates
      - ./docker/amf-docker/files/ca.crt:/etc/open5gs/default/tls/ca.crt:ro
      - ./docker/amf-docker/files/amf.crt:/etc/open5gs/default/tls/amf.crt:ro
      - ./docker/amf-docker/files/amf.key:/etc/open5gs/default/tls/amf.key:ro
      # Configuration
      - ./docker/amf-docker/${AMF_CONFIG:-amf_tls.yaml}:/etc/open5gs/default/amf.yaml:ro
      # Binary file (allows updates without rebuilding image)
      - ./docker/amf-docker/files/open5gs-amfd:/usr/local/bin/open5gs-amfd:ro
    extra_hosts:
      - "nrf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.189"
      - "scp.localdomain:192.168.50.188"
      - "amf.localdomain:192.168.50.185"
      - "smf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.193"
      - "upf.localdomain:192.168.50.187"
      - "ausf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.191"
      - "udm.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.192"
      - "pcf.localdomain:192.168.50.194"
      - "nssf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.195"
      - "bsf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.196"
      - "udr.localdomain:192.168.50.199"
      - "sepp.localdomain:192.168.50.251"

    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    depends_on:
      - open5gs-nrf
      - open5gs-scp

  open5gs-smf:
    image: open5gs-smf:${OPEN5GS_TAG:-v2.8.0}
    container_name: open5gs-smf
    networks:
      my_custom_network:
        ipv4_address: 192.168.50.193
    volumes:
      # TLS certificates
      - ./docker/smf-docker/files/ca.crt:/etc/open5gs/default/tls/ca.crt:ro
      - ./docker/smf-docker/files/smf.crt:/etc/open5gs/default/tls/smf.crt:ro
      - ./docker/smf-docker/files/smf.key:/etc/open5gs/default/tls/smf.key:ro
      # Configuration
      - ./docker/smf-docker/${SMF_CONFIG:-smf_tls.yaml}:/etc/open5gs/default/smf.yaml:ro
      # Binary file (allows updates without rebuilding image)
      - ./docker/smf-docker/files/open5gs-smfd:/usr/local/bin/open5gs-smfd:ro
      # N4 (PFCP) IPsec: cert package + setup scripts for the SMF end of the
      # SMF<->UPF tunnel (see docker/n4-ipsec/). Toggled via n4_ipsec.sh.
      - ./docker/n4-ipsec/certs/smf:/n4-ipsec:ro
    extra_hosts:
      - "nrf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.189"
      - "scp.localdomain:192.168.50.188"
      - "amf.localdomain:192.168.50.185"
      - "smf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.193"
      - "upf.localdomain:192.168.50.187"
      - "ausf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.191"
      - "udm.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.192"
      - "pcf.localdomain:192.168.50.194"
      - "nssf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.195"
      - "bsf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.196"
      - "udr.localdomain:192.168.50.199"
      - "sepp.localdomain:192.168.50.251"

    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    depends_on:
      - open5gs-nrf
      - open5gs-scp
      - open5gs-amf

  open5gs-upf:
    image: open5gs-upf:${OPEN5GS_TAG:-v2.8.0}
    container_name: open5gs-upf
    network_mode: host
    volumes:
      # Configuration
      - ./docker/upf-docker/${UPF_CONFIG:-upf_tls.yaml}:/etc/open5gs/default/upf.yaml:ro
      # Binary file (allows updates without rebuilding image)
      #- ./docker/upf-docker/files/open5gs-upfd:/usr/local/bin/open5gs-upfd:ro
    extra_hosts:
      - "nrf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.189"
      - "scp.localdomain:192.168.50.188"
      - "amf.localdomain:192.168.50.185"
      - "smf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.193"
      - "upf.localdomain:192.168.50.187"
      - "ausf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.191"
      - "udm.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.192"
      - "pcf.localdomain:192.168.50.194"
      - "nssf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.195"
      - "bsf.5gc.mnc071.mcc999.3gppnetwork.org:192.168.50.196"
      - "udr.localdomain:192.168.50.199"
      - "sepp.localdomain:192.168.50.251"
