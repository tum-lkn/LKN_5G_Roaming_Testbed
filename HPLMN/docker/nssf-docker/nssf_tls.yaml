logger:
  file:
    path: var/log/open5gs/nssf.log
#  level: info   # fatal|error|warn|info(default)|debug|trace

global:
  max:
    ue: 1024  # The number of UE can be increased depending on memory size.
#    peer: 64




nssf:

  default:
    tls:
      server:
        scheme: https
        private_key: /etc/open5gs/default/tls/nssf.key
        cert: /etc/open5gs/default/tls/nssf.crt
        sslkeylogfile: /var/log/open5gs/tls/nssf-server-sslkeylog.log
      client:
        scheme: https
        cacert: /etc/open5gs/default/tls/ca.crt
        client_sslkeylogfile: /var/log/open5gs/tls/nssf-client-sslkeylog.log

  sbi:
    server:
      - address: nssf.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      nrf:
        - uri: https://nrf.5gc.mnc001.mcc001.3gppnetwork.org
        
      nsi:
        - uri: https://nrf.5gc.mnc001.mcc001.3gppnetwork.org
          s_nssai:
            sst: 1
