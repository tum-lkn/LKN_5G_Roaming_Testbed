logger:
  file:
    path: var/log/open5gs/amf.log
#  level: info   # fatal|error|warn|info(default)|debug|trace

global:
  max:
    ue: 1024  # The number of UE can be increased depending on memory size.
#    peer: 64

amf:

  default:
    tls:
      server:
        scheme: https
        private_key: /etc/open5gs/default/tls/amf.key
        cert: /etc/open5gs/default/tls/amf.crt
        sslkeylogfile: /var/log/open5gs/tls/amf-server-sslkeylog.log
      client:
        scheme: https
        cacert: /etc/open5gs/default/tls/ca.crt
        client_sslkeylogfile: /var/log/open5gs/tls/amf-client-sslkeylog.log

  sbi:
    server:
      - address: amf.localdomain


    client:
      nrf:
        - uri: https://nrf.5gc.mnc001.mcc001.3gppnetwork.org

  ngap:
    server:
      - address: 192.168.60.185  # Updated from 127.0.0.5 to the ip address of pc
  metrics:
    server:
      - address: 192.168.60.185
        port: 9090
  access_control:  # Added access_control section
    - plmn_id:
        mcc: 999
        mnc: 71
    - plmn_id:
        mcc: 001
        mnc: 01
    - plmn_id:
        mcc: 315
        mnc: 010
  guami:
    - plmn_id:
        mcc: 001  # Updated from mcc: 999 to mcc: 001
        mnc: 01   # Updated from mnc: 70 to mnc: 01
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 001  # Updated from mcc: 999 to mcc: 001
        mnc: 01   # Updated from mnc: 70 to mnc: 01
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 001  # Updated from mcc: 999 to mcc: 001
        mnc: 01   # Updated from mnc: 70 to mnc: 01
      s_nssai:
        - sst: 1

  security:
    integrity_order : [ NIA2, NIA1, NIA0 ]
    ciphering_order : [ NEA0, NEA1, NEA2 ]

  network_name:
    full: Open5GS
    short: Next

  amf_name: open5gs-amf0

  time:
#    t3502:
#      value: 720   # 12 minutes * 60 = 720 seconds
    t3512:
      value: 540    # 9 minutes * 60 = 540 seconds
