logger:
  file:
    path: var/log/open5gs/bsf.log
#  level: info   # fatal|error|warn|info(default)|debug|trace

global:
  max:
    ue: 1024  # The number of UE can be increased depending on memory size.
#    peer: 64

bsf:

  default:
    tls:
      server:
        scheme: https
        private_key: /etc/open5gs/default/tls/bsf.key
        cert: /etc/open5gs/default/tls/bsf.crt
        sslkeylogfile: /var/log/open5gs/tls/bsf-server-sslkeylog.log
      client:
        scheme: https
        cacert: /etc/open5gs/default/tls/ca.crt
        client_sslkeylogfile: /var/log/open5gs/tls/bsf-client-sslkeylog.log


  sbi:
    server:
      - address: bsf.5gc.mnc001.mcc001.3gppnetwork.org


    client:
      nrf:
        - uri: https://nrf.5gc.mnc001.mcc001.3gppnetwork.org
