  open5gs-sepp:
    image: open5gs-sepp:v2.7.6-hr
    container_name: open5gs-sepp
    labels:
      - o5gc.stack=open5gs-lkn-testbed-home-network-hr    
    networks:
      my_custom_network:
        ipv4_address: 192.168.60.251  # SEPP static IP on Docker bridge network
    ports:
      - "8080:8080"  # N32 port (Host:Container)
      - "8081:8081"  # N32-f port (Host:Container)
    volumes:
      # TLS certificates
      - ./docker/sepp-docker/files/ca.crt:/etc/open5gs/default/tls/ca.crt:ro
      - ./docker/sepp-docker/files/sepp.crt:/etc/open5gs/default/tls/sepp.crt:ro
      - ./docker/sepp-docker/files/sepp.key:/etc/open5gs/default/tls/sepp.key:ro
      # Configuration
      - ./docker/sepp-docker/${SEPP_CONFIG:-sepp_tls.yaml}:/etc/open5gs/default/sepp.yaml:ro
      # Binary file (allows updates without rebuilding image)
      - ./docker/sepp-docker/files/open5gs-seppd:/usr/local/bin/open5gs-seppd:ro
    extra_hosts:
      - "nrf.5gc.mnc001.mcc001.3gppnetwork.org:192.168.60.189"
      - "scp.localdomain:192.168.60.188"
      - "amf.localdomain:192.168.60.185"
      - "smf.5gc.mnc001.mcc001.3gppnetwork.org:192.168.60.193"
      - "upf.localdomain:192.168.60.187"
      - "ausf.5gc.mnc001.mcc001.3gppnetwork.org:192.168.60.191"
      - "udm.5gc.mnc001.mcc001.3gppnetwork.org:192.168.60.192"
      - "pcf.localdomain:192.168.60.194"
      - "nssf.5gc.mnc001.mcc001.3gppnetwork.org:192.168.60.195"
      - "bsf.5gc.mnc001.mcc001.3gppnetwork.org:192.168.60.196"
      - "udr.localdomain:192.168.60.199"
      - "sepp.localdomain:192.168.60.251"
      - "sepp1.localdomain:10.162.149.192" # VPLMN_IP - Update this to your VPLMN PC IP
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    depends_on:
      - open5gs-nrf
      - open5gs-scp
      - open5gs-amf
      - open5gs-smf
      - open5gs-upf
      - open5gs-ausf
      - open5gs-udm
      - open5gs-mongodb
      - open5gs-pcf
      - open5gs-nssf
      - open5gs-bsf
      - open5gs-udr