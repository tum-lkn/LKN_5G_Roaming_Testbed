DELAY_ENABLED=false

# ============================================================================
# N6 INTERFACE DELAY CONFIGURATION (MERGED in v3.2.3)
# ============================================================================
# N6 delay simulates data network (internet) latency.
#
# MERGED BEHAVIOR (v3.2.3):
# When N6_DELAY_ENABLED=true, the SAME delay is automatically applied to:
#   1) UPF ogstun (tun device) - based on roaming mode:
#      * LBO mode: LOCAL UPF (VPLMN handles DN traffic)
#      * HR mode: REMOTE UPF (HPLMN handles DN traffic)
#      * Non-roaming: LOCAL UPF
#   2) Server interface (ens18 on perf-server 10.162.149.210):
#      * Filtered by UE subnet (10.45.0.0/16)
#      * Creates symmetric bidirectional delay
#
# This replaces the old separate N6_SERVER_DELAY_* parameters.
# You only need to set ONE delay value and it applies everywhere.
#
# TYPICAL LATENCY VALUES:
#   Same country:    20ms RTT (10ms each way)
#   US East Coast:  100ms RTT (50ms each way)
#   US West Coast:  150ms RTT (75ms each way)
#   Europe:         100ms RTT (50ms each way)
#   Asia:           200ms RTT (100ms each way)

N6_DELAY_ENABLED=false

# N6 delay value (applied to BOTH ogstun and server interface)
N6_DELAY_VALUE=50ms
N6_DELAY_JITTER=10ms

# ============================================================================
# DELAY RULES (Traditional format)
# ============================================================================
# Format: location:service:mode=delay_value[:jitter_value]
#
# UPF delay modes:
#   gtpu   - GTP-U traffic (port 2152) - N9 user plane
#   ipsec  - ESP protocol traffic
#   pfcp   - PFCP traffic (port 8805) - N4 control plane
#   n6     - N6 interface (ogstun) - Data Network
#   n3     - N3 interface (local only)
#   full   - All traffic
#
# SEPP delay modes:
#   n32    - N32 interface (ports 8080/8081)
#   eth0   - All container traffic
#
# SMF delay modes:
#   pfcp   - PFCP traffic to UPF (port 8805)
#   eth0   - All container traffic
#
# Examples:
# DELAY_RULE_1=local:open5gs-upf:gtpu=50ms
# DELAY_RULE_2=remote:open5gs-upf:gtpu=50ms:10ms
# DELAY_RULE_3=local:open5gs-sepp:n32=25ms:5ms

